<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل دخول - مساعد كبار السن</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>تسجيل الدخول</h1>
    </header>
    <main>
      <section>
        <h2>الدخول الى حسابك</h2>
        <form>
          <div class="input-group">
            <span class="input-icon">👤</span>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="البريد الالكتروني"
              required
            />
          </div>
          <div class="input-group">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="كلمة المرور"
              required
            />
          </div>
          <br />
          <button type="submit">تسجيل الدخول</button>
        </form>
      </section>
      <section>
        <p>ليس لديك حساب؟</p>
        <a href="register.html">انشاء حساب جديد</a>
      </section>
    </main>
    <footer>
      <p><a href="index.html">العودة الى الصفحة الرئيسية</a></p>
    </footer>
  </body>
</html>
