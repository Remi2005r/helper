<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعدك الرقمي-إنشاء حساب</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
<h1>مساعدك الرقمي</h1>
<p>انضم الينا بخطوة واحدة</p>
 </header>
 <main class="box">
<div class="card">
<h2>حساب جديد</h2>
<form action="dashbored.html">
<div class="field">
<label >الاسم كامل</label>
<input type="text" placeholder="ادخل اسمك" required>
</div>
<div class="field">
<label >البريد الالكتروني</label>
<input type="email" placeholder="example@gmail.com" required>
</div>
<div class="field">
<label >كلمة المرور</label>
<input type="password" placeholder="**********" required>
</div>
<button type="submit " class="btn">انشاء الحساب</button>
</form>
<div class="footer">
    <span>لديك حساب بالفعل</span>
    <a href="index.html">تسجيل دخول</a>
</div>
</div>

 </main>
</body>
</html>
